[package]
name = "openblockperf"
version = "0.0.1"
edition = "2021"
description = "Experimental Rust OpenBlockperf client (explore-first; Python remains production)"
license = "Apache-2.0"
publish = false

[[bin]]
name = "blockperf"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures = "0.3"
hex = "0.4"
hickory-resolver = "0.25"
hostname = "0.4"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
ciborium = "0.2"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
